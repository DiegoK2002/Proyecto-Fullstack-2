<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mantenedor de Productos - Sonido Vivo Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="noticias.css">
</head>
<body class="d-flex flex-column min-vh-100">

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top border-bottom border-warning">
    <div class="container">
      <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="admin-main.html">
        <i class="bi bi-shield-lock-fill"></i> Sonido Vivo <span class="badge bg-danger fs-6 ms-2">Admin</span>
      </a>
      <div class="collapse navbar-collapse">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link" href="admin-main.html">Inicio Panel</a></li>
          <li class="nav-item"><a class="nav-link active fw-bold" href="admin-productos.html">Mantenedor Productos</a></li>
          <li class="nav-item"><a class="nav-link" href="admin-usuarios.html">Mantenedor Usuarios</a></li>
        </ul>
        <a href="catalogo.html" class="btn btn-outline-light btn-sm"><i class="bi bi-shop me-1"></i> Sitio Público</a>
      </div>
    </div>
  </nav>

  <main class="container my-5 flex-grow-1">
    <div id="alerta-container"></div>
    <div class="card shadow-lg border-0 mb-4">
      <div class="card-body p-4 d-flex justify-content-between align-items-center">
        <div>
          <h2 class="fw-bold text-dark mb-0">Mantenedor de Productos</h2>
          <p class="text-muted mb-0">Creación, edición y eliminación del inventario</p>
        </div>
        <button id="btn-nuevo-producto" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalProducto">
          <i class="bi bi-plus-lg me-1"></i> Nuevo Producto
        </button>
      </div>
    </div>

    <div class="card shadow-sm border-0 w-100" style="max-height: 500px; overflow-y: auto;">
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead class="table-dark">
              <tr>
                <th>ID</th>
                <th>Producto</th>
                <th>Categoría</th>
                <th>Precio</th>
                <th>Stock</th>
                <th class="text-end">Acciones</th>
              </tr>
            </thead>
            <tbody id="tabla-productos-body">
              <!-- Renderizado dinámico desde JS -->
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <!-- Modal para Agregar/Editar Producto -->
  <div class="modal fade" id="modalProducto" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header bg-dark text-white">
          <h5 class="modal-title" id="modalProductoTitulo">Formulario de Producto</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="form-producto" class="row g-3">
            <input type="hidden" id="p-id">
            <div class="col-md-8">
              <label class="form-label fw-bold">Nombre del Producto</label>
              <input type="text" id="p-nombre" class="form-control" placeholder="Ej: Guitarra Eléctrica Fender" required>
            </div>
            <div class="col-md-4">
            <label class="form-label fw-bold">Categoría</label>
            <select id="p-categoria" class="form-select" required>
              <!-- Se rellena automáticamente con JS -->
            </select>
          </div>
            <div class="col-md-6">
              <label class="form-label fw-bold">Precio ($)</label>
              <input type="number" id="p-precio" class="form-control" placeholder="199990" required>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-bold">Stock</label>
              <input type="number" id="p-stock" class="form-control" placeholder="10" required>
            </div>
            <div class="col-12">
              <label class="form-label fw-bold">Ruta Imagen</label>
              <input type="text" id="p-imagen" class="form-control" placeholder="imagenes/cards/1.png">
            </div>
            <div class="col-12">
              <label class="form-label fw-bold">Descripción Corta</label>
              <textarea id="p-descripcion" class="form-control" rows="2" required></textarea>
            </div>
            <div class="col-12">
              <button type="submit" class="btn btn-primary w-100">Guardar Producto</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <footer class="text-center mt-auto">
    <div class="container">
      <small>&copy; 2026 Sonido Vivo - Módulo de Administración</small>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/productos.js"></script>
  <script src="js/admin-productos.js"></script>
</body>
</html>
