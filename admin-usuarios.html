<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mantenedor de Usuarios - Sonido Vivo Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="noticias.css">
</head>
<body class="d-flex flex-column min-vh-100">

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top border-bottom border-warning">
    <div class="container">
      <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="admin-main.html">
        <i class="bi bi-shield-lock-fill"></i> Sonido Vivo <span class="badge bg-danger fs-6 ms-2">Admin</span>
      </a>
      <div class="collapse navbar-collapse">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link" href="admin-main.html">Inicio Panel</a></li>
          <li class="nav-item"><a class="nav-link" href="admin-productos.html">Mantenedor Productos</a></li>
          <li class="nav-item"><a class="nav-link active fw-bold" href="admin-usuarios.html">Mantenedor Usuarios</a></li>
        </ul>
        <a href="index.html" class="btn btn-outline-light btn-sm"><i class="bi bi-shop me-1"></i> Sitio Público</a>
      </div>
    </div>
  </nav>

  <main class="container my-5 flex-grow-1">
    <div class="card shadow-lg border-0 mb-4">
      <div class="card-body p-4 d-flex justify-content-between align-items-center">
        <div>
          <h2 class="fw-bold text-dark mb-0">Mantenedor de Usuarios</h2>
          <p class="text-muted mb-0">Gestión de cuentas, datos personales y asignación de perfil/rol</p>
        </div>
        <button id="btn-nuevo-usuario" class="btn btn-success" data-bs-toggle="modal" data-bs-target="#modalUsuario">
          <i class="bi bi-person-plus-fill me-1"></i> Nuevo Usuario
        </button>
      </div>
    </div>

    <div class="card shadow-sm border-0 w-100" style="max-height: 450px; overflow-y: auto;">
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead class="table-dark">
              <tr>
                <th>RUN</th>
                <th>Nombre</th>
                <th>Correo</th>
                <th>Rol</th>
                <th class="text-end">Acciones</th>
              </tr>
            </thead>
            <tbody id="tabla-usuarios-body">
              <!-- Carga simulada dinámicamente -->
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <!-- Modal Gestión de Usuario -->
  <div class="modal fade" id="modalUsuario" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header bg-dark text-white">
          <h5 class="modal-title" id="modalUsuarioTitulo">Gestión de Usuario</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="form-usuario" class="row g-3">
            <input type="hidden" id="u-index">
            <div class="col-md-6">
              <label class="form-label fw-bold">RUN</label>
              <input type="text" id="u-run" class="form-control" placeholder="12345678-K" required>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-bold">Rol de Usuario</label>
              <select id="u-rol" class="form-select">
                <option value="Cliente">Cliente</option>
                <option value="Administrador">Administrador</option>
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-bold">Nombre</label>
              <input type="text" id="u-nombre" class="form-control" placeholder="Juan" required>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-bold">Apellidos</label>
              <input type="text" id="u-apellidos" class="form-control" placeholder="Pérez" required>
            </div>
            <div class="col-12">
              <label class="form-label fw-bold">Correo Electrónico</label>
              <input type="email" id="u-correo" class="form-control" placeholder="correo@ejemplo.com" required>
            </div>
            <div class="col-12">
              <button type="submit" class="btn btn-success w-100">Guardar Usuario</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <footer class="text-center mt-auto">
    <div class="container">
      <small>&copy; 2026 Sonido Vivo - Módulo de Administración</small>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/admin-usuarios.js"></script>
</body>
</html>
