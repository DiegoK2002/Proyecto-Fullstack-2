  <main class="container my-5 flex-grow-1">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6">
        <div class="card shadow-sm border-0">
          <div class="card-body p-4 p-md-5">
            <h2 class="card-title text-center fw-bold mb-4">Contáctanos</h2>
            <p class="text-muted text-center mb-4">¿Tienes dudas o consultas? Envíanos un mensaje y te responderemos a la brevedad.</p>

            <form id="form-contacto" novalidate>
              <div class="mb-3">
                <label for="contacto-nombre" class="form-label fw-semibold">Nombre Completo *</label>
                <input type="text" class="form-control" id="contacto-nombre" placeholder="Ej: María González" required maxlength="100">
              </div>

              <div class="mb-3">
                <label for="contacto-correo" class="form-label fw-semibold">Correo Electrónico *</label>
                <input type="email" class="form-control" id="contacto-correo" placeholder="nombre@ejemplo.com" required maxlength="100">
              </div>

              <div class="mb-3">
                <label for="contacto-mensaje" class="form-label fw-semibold">Mensaje *</label>
                <textarea class="form-control" id="contacto-mensaje" rows="5" placeholder="Escribe tu mensaje aquí..." required maxlength="500"></textarea>
                <div class="form-text">Máximo 500 caracteres.</div>
              </div>

              <button type="submit" class="btn btn-primary w-100 py-2">Enviar Mensaje</button>
            </form>
          </div>
        </div>
      </div>
    </div>
